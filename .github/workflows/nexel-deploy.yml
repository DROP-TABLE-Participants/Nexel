name: Build and publish Nexel image to Docker Hub

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_REPOSITORY: gluckit/nexel
  DEPLOYMENT_REPO: DROP-TABLE-Participants/Nexel.Deployment
  DEPLOYMENT_FILE: k8s/nexel/prod/nexel/deployment.yaml

jobs:
  build-and-push:
    name: Build and Push Container
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.set-metadata.outputs.image_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set build metadata
        id: set-metadata
        run: |
          TIMESTAMP=$(date +'%Y%m%d-%H%M')
          SHORT_SHA=${GITHUB_SHA::7}
          IMAGE_TAG="prod-${TIMESTAMP}-${SHORT_SHA}"

          echo "TIMESTAMP=$TIMESTAMP" >> "$GITHUB_ENV"
          echo "SHORT_SHA=$SHORT_SHA" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: |
          docker build \
            -t "${IMAGE_REPOSITORY}:${IMAGE_TAG}" \
            -t "${IMAGE_REPOSITORY}:prod-latest" \
            .

      - name: Push Docker image
        run: |
          docker push "${IMAGE_REPOSITORY}:${IMAGE_TAG}"
          docker push "${IMAGE_REPOSITORY}:prod-latest"

  update-deployment:
    name: Update Deployment Repository
    needs: build-and-push
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
    steps:
      - name: Update deployment image tag
        env:
          PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        run: |
          if [ -z "$PERSONAL_ACCESS_TOKEN" ]; then
            echo "Missing PERSONAL_ACCESS_TOKEN secret"
            exit 1
          fi

          git clone "https://x-access-token:${PERSONAL_ACCESS_TOKEN}@github.com/${DEPLOYMENT_REPO}.git" deploy-repo
          cd deploy-repo

          if [ ! -f "$DEPLOYMENT_FILE" ]; then
            echo "Deployment file not found: $DEPLOYMENT_FILE"
            exit 1
          fi

          NEW_IMAGE="${IMAGE_REPOSITORY}:${IMAGE_TAG}"
          sed -i "0,/image:/s|image: .*|image: ${NEW_IMAGE}|" "$DEPLOYMENT_FILE"

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add "$DEPLOYMENT_FILE"
          git commit -m "Update Nexel image to ${IMAGE_TAG}" || echo "No deployment image changes to commit"
          git push
